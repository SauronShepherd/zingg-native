resources:
  jobs:
    zingg_native_serverless_jaro_action_probe:
      name: zingg-native-serverless-jaro-action-probe
      description: Isolated exact public-expression Jaro action diagnostic.
      timeout_seconds: 600
      tasks:
        - task_key: jaro_action
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-fuzzy-action-probe
              - --native-fuzzy-actions-only
              - --native-fuzzy-action-rule
              - JaroWinklerFunction
              - --native-fuzzy-action-rows
              - "4"
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
    zingg_native_serverless_affine_action_probe:
      name: zingg-native-serverless-affine-action-probe
      description: Isolated exact public-expression affine-gap action diagnostic.
      timeout_seconds: 600
      tasks:
        - task_key: affine_action
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-fuzzy-action-probe
              - --native-fuzzy-actions-only
              - --native-fuzzy-action-rule
              - AffineGapSimilarityFunction
              - --native-fuzzy-action-rows
              - "4"
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
