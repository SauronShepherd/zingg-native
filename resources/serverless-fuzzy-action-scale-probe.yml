resources:
  jobs:
    zingg_native_serverless_fuzzy_action_scale_probe:
      name: zingg-native-serverless-fuzzy-action-scale-probe
      description: 100-row Jaro and affine-gap action-only scale probe
      timeout_seconds: 600
      tasks:
        - task_key: fuzzy_actions_scale
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-fuzzy-action-probe
              - --native-fuzzy-actions-only
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
