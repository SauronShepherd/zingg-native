resources:
  jobs:
    zingg_native_serverless_model_cross_job_train:
      name: zingg-native-serverless-model-cross-job-train
      description: Serverless process-1 native model fit and durable save
      max_concurrent_runs: 1
      timeout_seconds: 900
      tasks:
        - task_key: fit_save
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-model-probe
              - --native-model-probe-path
              - ${var.model_probe_path}
              - --native-model-probe-features
              - "2"
              - --native-model-max-iter
              - "1"
              - --native-model-bounded-probe
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
    zingg_native_serverless_model_cross_job_load:
      name: zingg-native-serverless-model-cross-job-load
      description: Serverless process-2 native model load and predict
      max_concurrent_runs: 1
      timeout_seconds: 600
      tasks:
        - task_key: load_predict
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-model-load-probe
              - --native-model-probe-path
              - ${var.model_probe_path}
              - --native-model-probe-features
              - "2"
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
