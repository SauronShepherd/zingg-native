resources:
  jobs:
    zingg_native_serverless_model_corruption_probe:
      name: zingg-native-serverless-model-corruption-probe
      description: Expected-failure Serverless probe for corrupt native model sidecars
      max_concurrent_runs: 1
      timeout_seconds: 300
      tasks:
        - task_key: corrupt_model
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-model-corruption-probe
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
