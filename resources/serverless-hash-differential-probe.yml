resources:
  jobs:
    zingg_native_serverless_hash_differential_probe:
      name: zingg-native-serverless-hash-differential-probe
      description: Serverless reflection-oracle parity probe for the upstream string hash family
      max_concurrent_runs: 1
      tasks:
        - task_key: hash_differential
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-mode
              - STRICT
              - --native-hash-differential-probe
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
