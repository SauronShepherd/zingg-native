        - task_key: train_diagnostic
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --delegate-main
              - ${var.zingg_main_class}
              - --native-mode
              - STRICT
              - --native-plan-guard
              - "true"
              - --native-model-max-iter
              - "1"
              - --native-model-quick-probe
              - "true"
              - --phase
              - train
              - --conf
              - ${var.workspace_fixture_root}/config-volume.json
              - --zinggDir
              - /Volumes/${var.catalog}/${var.schema}/${var.volume}/models-job-v9
              - --license
              - ${var.license_path}
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}

    zingg_native_serverless_model_probe:
      name: zingg-native-serverless-model-probe
      description: Bounded public-API model fit/save/load/predict probe on Serverless
