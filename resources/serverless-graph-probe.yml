resources:
  jobs:
    zingg_native_serverless_graph_probe:
      name: zingg-native-serverless-graph-probe
      description: Nontrivial relational connected-components and strict iteration-bound probe
      max_concurrent_runs: 1
      tasks:
        - task_key: graph_probe
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-mode
              - STRICT
              - --native-graph-probe
              - --native-graph-materialize-path
              - /Volumes/${var.catalog}/${var.schema}/${var.volume}/graph-probe
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
