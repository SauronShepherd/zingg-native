resources:
  jobs:
    zingg_native_serverless_core_e2e:
      name: zingg-native-serverless-core-e2e-bundle
      description: Serverless public-API shared-core E2E; no Connect server plugin dependency
      max_concurrent_runs: 1
      tasks:
        - task_key: shared_core_e2e
          spark_jar_task:
            main_class_name: ai.zingg.serverless.ServerlessCoreE2E
            parameters:
              - --output-path
              - ${var.output_volume}/bundle-run
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.artifact_root}/zingg-native-core_2.13-0.2.0-SNAPSHOT.jar
