resources:
  jobs:
    zingg_native_serverless_strict_unknown_operation:
      name: zingg-native-serverless-strict-unknown-operation
      description: Negative STRICT probe; unknown native operation must fail closed.
      timeout_seconds: 300
      tasks:
        - task_key: unknown_operation
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-differential-probe
              - --native-differential-rules
              - unknown_operation
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
    zingg_native_serverless_strict_disabled_rule:
      name: zingg-native-serverless-strict-disabled-rule
      description: Negative STRICT probe; disabling a required rule must fail closed.
      timeout_seconds: 300
      tasks:
        - task_key: disabled_rule
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-differential-probe
              - --native-differential-rules
              - exact
              - --native-disabled-rules
              - rewrite.similarity.exact
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
