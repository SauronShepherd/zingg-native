resources:
  jobs:
    zingg_native_serverless_materialization_failure_probe:
      name: zingg-native-serverless-materialization-failure-probe
      description: Expected-failure job proving run-scoped transient cleanup executes in launcher finally.
      timeout_seconds: 300
      tasks:
        - task_key: intentional_failure
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-mode
              - STRICT
              - --native-materialization-failure-probe
              - --native-run-id
              - 11111111-1111-4111-8111-111111111111
              - --zinggDir
              - /Volumes/${var.catalog}/${var.schema}/${var.volume}/materialization-recovery-probe
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
    zingg_native_serverless_materialization_recovery_probe:
      name: zingg-native-serverless-materialization-recovery-probe
      description: Follow-up job proving a failed run leaves no reusable transient sentinel.
      timeout_seconds: 300
      tasks:
        - task_key: recovery_check
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-mode
              - STRICT
              - --native-materialization-recovery-probe
              - --native-run-id
              - 11111111-1111-4111-8111-111111111111
              - --zinggDir
              - /Volumes/${var.catalog}/${var.schema}/${var.volume}/materialization-recovery-probe
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
