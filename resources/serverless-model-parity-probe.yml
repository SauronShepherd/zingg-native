resources:
  jobs:
    zingg_native_serverless_model_parity_probe:
      name: zingg-native-serverless-model-parity-probe
      description: Serverless production-iteration native model artifact for Spark ML oracle comparison
      timeout_seconds: 1200
      tasks:
        - task_key: model_parity
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-model-probe
              - --native-model-probe-path
              - ${var.model_probe_path}
              - --native-model-probe-features
              - "2"
              - --native-model-max-iter
              - "100"
              - --native-model-parity-probe
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
