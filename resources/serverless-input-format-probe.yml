resources:
  jobs:
    zingg_native_serverless_input_format_probe:
      name: zingg-native-serverless-input-format-probe
      description: Ordinary patched Zingg SparkDFReader CSV/JSON/Parquet matrix on Serverless.
      timeout_seconds: 600
      tasks:
        - task_key: input_formats
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-input-format-probe
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
