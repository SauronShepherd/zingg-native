resources:
  jobs:
    zingg_native_serverless_fuzzy_action_probe:
      name: zingg-native-serverless-fuzzy-action-probe
      description: Isolated public-expression Jaro and affine-gap action probe
      timeout_seconds: 600
      tasks:
        - task_key: fuzzy_actions
          spark_jar_task:
            main_class_name: ai.zingg.nativebridge.launch.DatabricksZinggMainEntry
            parameters:
              - --native-fuzzy-action-probe
              - --native-fuzzy-actions-only
              - --native-fuzzy-action-rows
              - "4"
              - --native-mode
              - STRICT
          environment_key: serverless_env5
      environments:
        - environment_key: serverless_env5
          spec:
            environment_version: "5"
            java_dependencies:
              - ${var.serverless_launcher_jar}
              - ${var.native_core_jar}
              - ${var.zingg_patched_jar}
