name: format-z2-5-branch

on:
  push:
    branches:
      - build-plan/2026-09-13-nonfinite-strict

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build-plan/2026-09-13-nonfinite-strict
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -Pdatabricks-serverless-env5 spotless:apply
      - name: Commit formatter output
        run: |
          if git diff --quiet -- core/src/main/scala/ai/zingg/native/NativeModel.scala; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/src/main/scala/ai/zingg/native/NativeModel.scala
          git commit -m "style: apply scalafmt to NativeModel"
          git push origin HEAD:build-plan/2026-09-13-nonfinite-strict
