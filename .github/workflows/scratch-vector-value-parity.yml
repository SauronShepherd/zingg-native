name: scratch-vector-value-parity

on:
  push:
    branches: [scratch/2026-09-12-vector-value-parity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply exact Z1.5 hunks
        shell: python
        run: |
          from pathlib import Path

          rules = Path('core/src/main/scala/ai/zingg/native/PublicRewriteRules.scala')
          text = rules.read_text(encoding='utf-8')
          old = '''  // Spark's public VectorUDT is represented as a struct. Read index 2 with\n  // public Column operations, handling both dense and sparse encodings; this\n  // avoids the optional ML helper class and unavailable Serverless SQL routine.\n  def vectorValue(value:Column):Column={\n    val vectorType=value.getField("type")\n    val size=value.getField("size")\n    val indices=value.getField("indices")\n    val values=value.getField("values")\n    // Spark 4 Serverless evaluates both branches under ANSI array bounds.\n    // Sparse vectors commonly store fewer than three values, so direct\n    // element_at(values, 3) can fail even when the sparse branch is selected.\n    // Safe access preserves null/missing entries without changing the vector\n    // contract or introducing a UDF.\n    val dense=try_element_at(values,lit(3))\n    val sparse=aggregate(sequence(lit(1),size),lit(0.0),(acc,pos)=>\n      when(try_element_at(indices,pos.cast("int"))===lit(2),try_element_at(values,pos.cast("int"))).otherwise(acc))\n    when(vectorType===lit(0),sparse).otherwise(dense)\n  }\n'''
          new = '''  // Zingg 0.7 VectorValueExtractor returns v.toArray()[1]: the second logical\n  // coordinate. Spark element_at is one-based for arrays, and sparse VectorUDT\n  // stores only materialized positions, so scan paired index/value entries\n  // rather than the declared vector dimension.\n  def vectorValue(value:Column):Column={\n    val vectorType=value.getField("type")\n    val indices=value.getField("indices")\n    val values=value.getField("values")\n    val dense=try_element_at(values,lit(2))\n    val sparse=aggregate(\n      zip_with(indices,values,(index,entry)=>struct(index.alias("index"),entry.alias("value"))),\n      lit(0.0),\n      (acc,pair)=>when(pair.getField("index")===lit(1),pair.getField("value")).otherwise(acc))\n    when(value.isNull,lit(null).cast("double"))\n      .when(vectorType===lit(0),sparse)\n      .otherwise(dense)\n  }\n'''
          assert text.count(old) == 1
          rules.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          probe = Path('serverless-launcher/src/main/scala/ai/zingg/native/launch/ServerlessVectorProbe.scala')
          text = probe.read_text(encoding='utf-8')
          old = '''    val sparse = struct(\n      lit(0).alias("type"), lit(4).alias("size"),\n      array(lit(1), lit(2)).alias("indices"),\n      array(lit(0.2d), lit(0.7d)).alias("values"))\n    val input = spark.range(0L, 3L).withColumn(\n      "vector", when(col("id") === lit(0L), dense).when(col("id") === lit(1L), sparse))\n    val provider = NativeOperationProvider.fromSpark(spark, "model.vector-differential")\n    val actual = provider.vectorValue(input, "vector", "value").select("id", "value").orderBy("id").collect()\n    require(actual.length == 3, s"Vector probe returned ${actual.length} rows")\n    require(actual(0).getDouble(1) == 3.5d, s"Dense vector mismatch: ${actual(0)}")\n    require(actual(1).getDouble(1) == 0.7d, s"Sparse vector mismatch: ${actual(1)}")\n    require(actual(2).isNullAt(1), s"Null vector mismatch: ${actual(2)}")\n    println("NATIVE_VECTOR_DIFFERENTIAL_PASS dense=3.5 sparse=0.7 null=true rows=3")\n'''
          new = '''    val sparsePresent = struct(\n      lit(0).alias("type"), lit(4).alias("size"),\n      array(lit(1), lit(2)).alias("indices"),\n      array(lit(0.2d), lit(0.7d)).alias("values"))\n    val sparseMissing = struct(\n      lit(0).alias("type"), lit(4).alias("size"),\n      array(lit(2), lit(3)).alias("indices"),\n      array(lit(0.7d), lit(0.9d)).alias("values"))\n    val input = spark.range(0L, 4L).withColumn(\n      "vector",\n      when(col("id") === lit(0L), dense)\n        .when(col("id") === lit(1L), sparsePresent)\n        .when(col("id") === lit(2L), sparseMissing))\n    val provider = NativeOperationProvider.fromSpark(spark, "model.vector-differential")\n    val actual = provider.vectorValue(input, "vector", "value").select("id", "value").orderBy("id").collect()\n    require(actual.length == 4, s"Vector probe returned ${actual.length} rows")\n    require(actual(0).getDouble(1) == 1.5d, s"Dense vector mismatch: ${actual(0)}")\n    require(actual(1).getDouble(1) == 0.2d, s"Sparse-present vector mismatch: ${actual(1)}")\n    require(actual(2).getDouble(1) == 0.0d, s"Sparse-missing vector mismatch: ${actual(2)}")\n    require(actual(3).isNullAt(1), s"Null vector mismatch: ${actual(3)}")\n    println("NATIVE_VECTOR_DIFFERENTIAL_PASS dense=1.5 sparsePresent=0.2 sparseMissing=0.0 null=true rows=4")\n'''
          assert text.count(old) == 1
          probe.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Check ratcheted Scala format without applying changes
        run: mvn -B spotless:check
      - name: Commit candidate
        run: |
          rm .github/workflows/scratch-vector-value-parity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: restore VectorValueExtractor index-one parity"
          git push origin HEAD:scratch/2026-09-12-vector-value-parity
