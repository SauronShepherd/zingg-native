name: zingg-native-ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test environment
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]' 'pyspark==4.1.0'
      - name: Compile Python
        run: python -m compileall -q python/src
      - name: Lint Python
        run: python -m ruff check python/src tests
      - name: Type-check Python
        run: python -m mypy python/src
      - name: Verify architecture boundaries
        shell: pwsh
        run: ./scripts/check-architecture.ps1
      - name: Verify pinned upstream operation inventory
        shell: pwsh
        run: ./scripts/check-upstream-inventory.ps1
      - name: Verify Zingg phase contract
        shell: pwsh
        run: ./scripts/check-phase-contract.ps1
      - name: Verify Photon evidence contract
        shell: pwsh
        run: ./scripts/check-photon-evidence.ps1
      - name: Test Python
        run: python -m pytest -q

  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build production Spark 4 Serverless artifacts
        run: |
          mvn -B -Dmaven.test.skip=true -Pdatabricks-serverless-env5 package -pl serverless-launcher -am
          pwsh ./scripts/check-serverless-core.ps1
          pwsh ./scripts/check-serverless-dependencies.ps1
          pwsh ./scripts/check-artifacts.ps1
          pwsh ./scripts/check-phase-contract.ps1
          pwsh ./scripts/check-upstream-native-patch.ps1
          pwsh ./scripts/check-source-context.ps1
          python scripts/check-source-boundaries.py
          pwsh ./scripts/build-patched-zingg.ps1 -Output dist/zingg-0.7.0-spark4-native.jar
          python scripts/check-serverless-bytecode.py core/target/zingg-native-core_2.13-0.3.0-SNAPSHOT.jar serverless-launcher/target/zingg-native-serverless-launcher_2.13-0.3.0-SNAPSHOT.jar dist/zingg-0.7.0-spark4-native.jar
          python scripts/check-release-metadata.py
          python scripts/verify-artifacts.py
          python scripts/artifact-checksums.py | tee artifact-sha256.txt
          test $(wc -l < artifact-sha256.txt) -eq 2
      - name: Upload artifact checksums
        uses: actions/upload-artifact@v4
        with:
          name: zingg-native-sha256
          path: artifact-sha256.txt
  semantic-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pinned Zingg 0.7 reference
        shell: pwsh
        run: ./scripts/prepare-reference.ps1
      - name: Verify reference is clean and pinned
        shell: pwsh
        run: ./scripts/check-reference.ps1
      - name: Verify overlay source context and tree digests
        shell: pwsh
        run: ./scripts/check-source-context.ps1
