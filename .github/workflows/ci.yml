name: zingg-native-ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test environment
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]' 'pyspark==4.1.0'
      - name: Compile Python
        run: python -m compileall -q python/src
      - name: Lint Python
        run: python -m ruff check python/src tests
      - name: Type-check Python
        run: python -m mypy python/src
      - name: Verify architecture boundaries
        shell: pwsh
        run: ./scripts/check-architecture.ps1
      - name: Verify pinned upstream operation inventory
        shell: pwsh
        run: ./scripts/check-upstream-inventory.ps1
      - name: Verify Zingg phase contract
        shell: pwsh
        run: ./scripts/check-phase-contract.ps1
      - name: Test Python
        run: python -m pytest -q

  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test shared Scala core and Connect plugin
        run: mvn -B test
      - name: Build release artifacts
        run: |
          mvn -B -DskipTests package
          pwsh ./scripts/check-serverless-core.ps1
          python -m pip install build
          python -m build --wheel
          test -f core/target/zingg-native-core_2.13-0.2.0-SNAPSHOT.jar
          test -f connect/target/zingg-native-connect_2.13-0.2.0-SNAPSHOT.jar
          python scripts/verify-artifacts.py
          python scripts/artifact-checksums.py | tee artifact-sha256.txt
          test $(wc -l < artifact-sha256.txt) -eq 3
      - name: Upload artifact checksums
        uses: actions/upload-artifact@v4
        with:
          name: zingg-native-sha256
          path: artifact-sha256.txt
      - name: Install wheel in a clean environment
        run: |
          wheel=$(ls dist/zingg_native-*.whl | tail -n 1)
          python -m venv .wheel-venv
          . .wheel-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyspark==4.1.0 "$GITHUB_WORKSPACE/$wheel"
          python - <<'PY'
          from zingg_native import NativeConfig, Zingg
          assert NativeConfig
          assert Zingg
          print("clean wheel import passed")
          PY
          export ZINGG_NATIVE_CORE_JAR="$GITHUB_WORKSPACE/core/target/zingg-native-core_2.13-0.2.0-SNAPSHOT.jar"
          python examples/classic_candidate_e2e.py

  jvm-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spark-profile: [default, spark40]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test Spark compatibility profile
        run: |
          if [ "${{ matrix.spark-profile }}" = "default" ]; then
            mvn -B test
          else
            mvn -B -P${{ matrix.spark-profile }} test
          fi

  semantic-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Zingg 0.7 reference
        shell: pwsh
        run: ./scripts/prepare-reference.ps1
      - name: Verify reference is clean and pinned
        shell: pwsh
        run: ./scripts/check-reference.ps1
