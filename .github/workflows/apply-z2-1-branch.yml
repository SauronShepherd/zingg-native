name: apply-z2-1-branch

on:
  push:
    branches:
      - build-plan/2026-09-13-distributed-gradient

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build-plan/2026-09-13-distributed-gradient
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Distribute materialized gradient reduction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('core/src/main/scala/ai/zingg/native/NativeModel.scala')
          text = path.read_text()
          start_marker = '''        case Some(_) =>
          // The persisted term array lets Serverless compute all term
'''
          end_marker = '''        case None =>
          // For small non-materialized probes, bounded scalar aggregates keep
'''
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''        case Some(_) =>
          // Explode the materialized term array positionally and reduce each
          // coefficient gradient in Spark. The driver receives one bounded row
          // per expanded feature instead of collect_list-ing every training row.
          val byPosition = gradientFrame
            .select(
              col("_native_error"),
              posexplode(col("_native_terms"))
                .as(Seq("_native_position", "_native_term"))
            )
            .groupBy(col("_native_position"))
            .agg(
              sum(col("_native_term") * col("_native_error"))
                .as("_native_gradient_sum"),
              sum(col("_native_error")).as("_native_error_sum"),
              count(lit(1)).as("_native_gradient_rows")
            )
            .orderBy(col("_native_position"))
            .collect()
          if (byPosition.isEmpty) {
            (Vector.fill(gradientTerms.length)(0.0d), 0.0d)
          } else {
            if (byPosition.length != gradientTerms.length)
              throw new NativeRewriteUnsupportedException(
                s"Native gradient reduction returned ${byPosition.length} positions for ${gradientTerms.length} terms"
              )
            val gradients = byPosition.zipWithIndex.map { case (row, expectedPosition) =>
              val position = row.getInt(0)
              if (position != expectedPosition)
                throw new NativeRewriteUnsupportedException(
                  s"Native gradient reduction expected position $expectedPosition but received $position"
                )
              val rows = if (row.isNullAt(3)) 0L else row.getLong(3)
              val divisor = if (rows == 0L) 1.0d else rows.toDouble
              finiteDouble(row, 1, context, "gradient-sum") / divisor
            }.toVector
            val first = byPosition.head
            val rows = if (first.isNullAt(3)) 0L else first.getLong(3)
            val divisor = if (rows == 0L) 1.0d else rows.toDouble
            val interceptGradient =
              finiteDouble(first, 2, context, "gradient-intercept-sum") / divisor
            (gradients, interceptGradient)
          }
'''
          text = text[:start] + replacement + text[end:]
          if 'collect_list(contributions)' in text:
              raise SystemExit('collect_list gradient path still present')
          path.write_text(text)
          PY
      - run: mvn -B -Pdatabricks-serverless-env5 spotless:apply
      - name: Commit rewrite
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/src/main/scala/ai/zingg/native/NativeModel.scala
          git commit -m "perf: aggregate materialized gradients by feature position"
          git push origin HEAD:build-plan/2026-09-13-distributed-gradient
