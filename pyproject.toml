[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "zingg-native"
version = "0.3.0.dev0"
description = "Transparent Zingg 0.7 native execution adapter for Databricks Photon and Serverless"
requires-python = ">=3.10"
# PySpark is supplied by the target Spark 4 runtime (including Databricks
# Serverless); installing it into a remote task is neither necessary nor safe.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6,<7",
  "ruff>=0.6,<0.17",
  "mypy>=1.11,<2.4",
  "build>=1.2,<2",
]
connect = [
  "pandas>=2.2,<4",
  "pyarrow>=15,<24",
  "grpcio>=1.67,<2",
  "grpcio-status>=1.48.1,<2",
  "zstandard>=0.25,<1",
]

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python/src"]
