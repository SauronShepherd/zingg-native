[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingg-native"
version = "0.2.0.dev0"
description = "Spark 4 native-friendly facade for selected Zingg 0.7 semantics"
requires-python = ">=3.10"
# PySpark is supplied by the target Spark 4 runtime (including Databricks
# Serverless); installing it into a remote task is neither necessary nor safe.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]
connect = [
  "pandas>=2.2",
  "pyarrow>=15",
  "grpcio>=1.67",
  "grpcio-status>=1.48.1",
  "zstandard>=0.25",
]

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
